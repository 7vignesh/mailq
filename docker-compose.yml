# Local development database. Host port 55432 avoids clashing with other
# local Postgres instances. Credentials are dev-only and not secret.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailq
      POSTGRES_PASSWORD: mailq
      POSTGRES_DB: mailq
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailq"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
